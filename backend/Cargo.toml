[package]
name = "mycctown-backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
# Web framework (ws feature for WebSocket upgrade)
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json",
] }

# Sessions
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# OAuth 1.0a signing
hmac = "0.12"
sha1 = "0.10"

# Encryption
aes-gcm = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
time = "0.3"

# Utilities
base64 = "0.22"
dotenvy = "0.15"
percent-encoding = "2"
url = "2"

# WebSocket poller registry + async helpers
dashmap = "6"
futures-util = "0.3"

# Error monitoring + tracing → GlitchTip (Sentry-compatible).
# Init is no-op when SENTRY_DSN is unset, so dev without GlitchTip stays unchanged.
sentry = { version = "0.48", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    "tracing",
] }
sentry-tower = { version = "0.48", features = ["http"] }
